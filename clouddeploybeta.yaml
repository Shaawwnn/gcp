steps:
  # Step 1: Install workspace dependencies
  - id: "install-dependencies"
    name: "node:22-alpine"
    entrypoint: "yarn"
    args: ["install", "--frozen-lockfile"]

  # # Step 2: Build Cloud Run Docker image (commented out for free tier)
  # - id: "build-cloud-run"
  #   name: "gcr.io/cloud-builders/docker"
  #   args:
  #     [
  #       "build",
  #       "-t",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #       ".",
  #     ]
  #   dir: "cloud-run"

  # # Step 3: Push image to Artifact Registry (commented out for free tier)
  # - id: "push-cloud-run"
  #   name: "gcr.io/cloud-builders/docker"
  #   args:
  #     [
  #       "push",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #     ]

  # # Step 4: Deploy Cloud Run service (commented out for free tier)
  # - id: "deploy-cloud-run"
  #   name: "gcr.io/cloud-builders/gcloud"
  #   args:
  #     [
  #       "run",
  #       "deploy",
  #       "cloud-run-learning",
  #       "--image",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #       "--region",
  #       "us-central1",
  #       "--platform",
  #       "managed",
  #       "--allow-unauthenticated",
  #     ]

  # Step 5: Build Next.js client
  - id: "build-nextjs"
    name: "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/nextjs:v1"
    args: ["cd client && yarn build"]

  # Step 6: Deploy Functions + Hosting together (optimized single deployment) and save preview URL
  - id: "deploy-firebase-preview"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-apps/firebase:v1"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        # Deploy preview channel and capture JSON output
        DEPLOY_JSON=$(firebase hosting:channel:deploy "${TAG_NAME}" --expires 1d --project "${PROJECT_ID}" --json)

        # Show full JSON in logs
        echo "$DEPLOY_JSON"

        # Extract preview URL using jq safely
        PREVIEW_URL=$(echo "$DEPLOY_JSON" | jq -r --arg proj "${PROJECT_ID}" '.result[$proj].url')

        # Print detected URL
        echo "Preview URL detected: ${PREVIEW_URL}"

        # Save preview URL to Firestore
        gcloud firestore documents create "preview-versions/${TAG_NAME}" \
          --data="{\"url\": \"${PREVIEW_URL}\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
          --project "${PROJECT_ID}"

# Logging configuration (required when using custom service account)
options:
  logging: CLOUD_LOGGING_ONLY
