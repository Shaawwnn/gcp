steps:
  # Step 1: Install workspace dependencies
  - id: "install-dependencies"
    name: "node:22-alpine"
    entrypoint: "yarn"
    args: ["install", "--frozen-lockfile"]

  # # Step 2: Build Cloud Run Docker image (commented out for free tier)
  # - id: "build-cloud-run"
  #   name: "gcr.io/cloud-builders/docker"
  #   args:
  #     [
  #       "build",
  #       "-t",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #       ".",
  #     ]
  #   dir: "cloud-run"

  # # Step 3: Push image to Artifact Registry (commented out for free tier)
  # - id: "push-cloud-run"
  #   name: "gcr.io/cloud-builders/docker"
  #   args:
  #     [
  #       "push",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #     ]

  # # Step 4: Deploy Cloud Run service (commented out for free tier)
  # - id: "deploy-cloud-run"
  #   name: "gcr.io/cloud-builders/gcloud"
  #   args:
  #     [
  #       "run",
  #       "deploy",
  #       "cloud-run-learning",
  #       "--image",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #       "--region",
  #       "us-central1",
  #       "--platform",
  #       "managed",
  #       "--allow-unauthenticated",
  #     ]

  # Step 5: Build Next.js client
  - id: "build-nextjs"
    name: "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/nextjs:v1"
    args: ["cd client && yarn build"]

  # Step 6: Build Cloud Run Functions
  - id: "build-cloud-run-functions"
    name: "node:22-alpine"
    entrypoint: "yarn"
    args: ["--cwd", "cloud-run-functions", "build"]

  # Step 7: Deploy to Hosting Preview Channel
  - id: "deploy-to-hosting-preview-channel"
    name: "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/firebase:v1"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -o pipefail

        # 'tee' saves the JSON to result.json AND passes it to jq
        firebase hosting:channel:deploy "${_TAG_NAME}" --expires 1d --json | tee result.json | \
        jq -r ".result[\"$PROJECT_ID\"].url" > /workspace/url.txt

        # Now result.json actually exists, so we can extract the expiry
        cat result.json | jq -r ".result[\"$PROJECT_ID\"].expireTime" > /workspace/expiry.txt

  # Step 8: Save the URL to Firestore
  - id: "save-preview-url-firestore"
   name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TOKEN=$$(gcloud auth print-access-token)
        
        # -w "%{http_code}" captures the status code (e.g., 200, 409)
        # -o /dev/null hides the long JSON response from the logs
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -X POST \
          "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/previews?documentId=${_TAG_NAME}" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"fields\": {
              \"url\": { \"stringValue\": \"$$(cat /workspace/url.txt)\" },
              \"version\": { \"stringValue\": \"${_TAG_NAME}\" },
              \"expires_at\": { \"timestampValue\": \"$$(cat /workspace/expiry.txt)\" },
              \"created_at\": { \"timestampValue\": \"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\" }
            }
          }")

        if [ "$$STATUS" -eq 200 ]; then
          echo "✅ Document created successfully."
        elif [ "$$STATUS" -eq 409 ]; then
          echo "❌ ERROR: Document with ID ${_TAG_NAME} already exists! Build failed to prevent overwrite."
          exit 1
        else
          echo "❌ ERROR: Firestore returned status $$STATUS"
          exit 1
        fi

# Logging configuration (required when using custom service account)
options:
  logging: CLOUD_LOGGING_ONLY
