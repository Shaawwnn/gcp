steps:
  # Step 1: Install workspace dependencies
  - id: "install-dependencies"
    name: "node:22-alpine"
    entrypoint: "yarn"
    args: ["install", "--frozen-lockfile"]

  # # Step 2: Build Cloud Run Docker image (commented out for free tier)
  # - id: "build-cloud-run"
  #   name: "gcr.io/cloud-builders/docker"
  #   args:
  #     [
  #       "build",
  #       "-t",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #       ".",
  #     ]
  #   dir: "cloud-run"

  # # Step 3: Push image to Artifact Registry (commented out for free tier)
  # - id: "push-cloud-run"
  #   name: "gcr.io/cloud-builders/docker"
  #   args:
  #     [
  #       "push",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #     ]

  # # Step 4: Deploy Cloud Run service (commented out for free tier)
  # - id: "deploy-cloud-run"
  #   name: "gcr.io/cloud-builders/gcloud"
  #   args:
  #     [
  #       "run",
  #       "deploy",
  #       "cloud-run-learning",
  #       "--image",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #       "--region",
  #       "us-central1",
  #       "--platform",
  #       "managed",
  #       "--allow-unauthenticated",
  #     ]

  # Step 5: Build Next.js client
  - id: "build-nextjs"
    name: "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/nextjs:v1"
    args: ["cd client && yarn build"]

  # Step 6: Build Cloud Run Functions
  - id: "build-cloud-run-functions"
    name: "node:22-alpine"
    entrypoint: "yarn"
    args: ["--cwd", "cloud-run-functions", "build"]

  # Step 7: Deploy to Hosting Preview Channel
  - id: "deploy-to-hosting-preview-channel"
    name: "gcr.io/google.com/cloudsdktool/google-cloud-cli:latest"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        # 1. Deploy
        firebase hosting:channel:deploy "${_TAG_NAME}" --expires 1d --json > result.json

        # 2. Extract with Node (finding the JSON start manually)
        URL=$(node -e "
          const fs = require('fs');
          const raw = fs.readFileSync('./result.json', 'utf8');
          const data = JSON.parse(raw.substring(raw.indexOf('{')));
          console.log(Object.values(data.result)[0].url);
        ")
        echo $$URL > /workspace/url.txt

  # Step 8: Save the URL to Firestore
  - id: "save-preview-url-firestore"
    name: "gcr.io/google.com/cloudsdktool/google-cloud-cli:latest"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        URL=$(cat /workspace/url.txt)
        gcloud firestore documents create \
          --collection=preview_deployments \
          --document-id="${TAG_NAME}" \
          --fields=url=string:"$$URL",status=string:"deployed",timestamp=timestamp:"$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    waitFor: ["deploy-to-hosting-preview-channel"]
# Logging configuration (required when using custom service account)
options:
  logging: CLOUD_LOGGING_ONLY
