steps:
  # Step 1: Install workspace dependencies
  - id: "install-dependencies"
    name: "node:22-alpine"
    entrypoint: "yarn"
    args: ["install", "--frozen-lockfile"]

  # # Step 2: Build Cloud Run Docker image (commented out for free tier)
  # - id: "build-cloud-run"
  #   name: "gcr.io/cloud-builders/docker"
  #   args:
  #     [
  #       "build",
  #       "-t",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #       ".",
  #     ]
  #   dir: "cloud-run"

  # # Step 3: Push image to Artifact Registry (commented out for free tier)
  # - id: "push-cloud-run"
  #   name: "gcr.io/cloud-builders/docker"
  #   args:
  #     [
  #       "push",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #     ]

  # # Step 4: Deploy Cloud Run service (commented out for free tier)
  # - id: "deploy-cloud-run"
  #   name: "gcr.io/cloud-builders/gcloud"
  #   args:
  #     [
  #       "run",
  #       "deploy",
  #       "cloud-run-learning",
  #       "--image",
  #       "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
  #       "--region",
  #       "us-central1",
  #       "--platform",
  #       "managed",
  #       "--allow-unauthenticated",
  #     ]

  # Step 5: Build Next.js client
  - id: "build-nextjs"
    name: "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/nextjs:v1"
    args: ["cd client && yarn build"]

  # Step 6: Deploy Functions + Hosting together (optimized single deployment)
  - id: "deploy-firebase-preview"
    name: "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/firebase:v1"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        # Deploy hosting + functions with JSON output
        DEPLOY_JSON=$(firebase hosting:channel:deploy "$TAG_NAME" --expires 1d --project "$PROJECT_ID" --json)
        echo "$DEPLOY_JSON"   # logs still streamed to console
        # Extract the preview URL
        PREVIEW_URL=$(echo "$DEPLOY_JSON" | jq -r ".result.\"$PROJECT_ID\".url")
        echo "Preview URL detected: $PREVIEW_URL"
        # Export it for the next step
        echo "PREVIEW_URL=$PREVIEW_URL"

  # Step 7: Save the preview version to FireStore
  - id: "save-preview-url-firestore"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    # Pass PREVIEW_URL from previous step via env
    env:
      - "PREVIEW_URL=$PREVIEW_URL"
    args:
      - "-c"
      - |
        echo "Saving preview URL $PREVIEW_URL to Firestore..."
        echo "PREVIEW_URL=$PREVIEW_URL"
        echo "TAG_NAME=$TAG_NAME"

# Logging configuration (required when using custom service account)
options:
  logging: CLOUD_LOGGING_ONLY
