# Production deploy: Cloud Run image + Functions + Hosting.
# Triggered by "deploy-gcp-prod".

# Stated explicitly so the build does not fall back to the default Cloud Build
# service account if the trigger is ever recreated without one.
serviceAccount: "projects/future-cat-475815-c2/serviceAccounts/cloud-build-deploy@future-cat-475815-c2.iam.gserviceaccount.com"

steps:
  # Step 1: Install workspace dependencies
  - id: "install-dependencies"
    name: "node:22-alpine"
    entrypoint: "yarn"
    args: ["install", "--frozen-lockfile"]

  # Step 2: Build Cloud Run Docker image
  - id: "build-cloud-run"
    name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
        ".",
      ]
    dir: "cloud-run"

  # Step 3: Push image to Artifact Registry
  - id: "push-cloud-run"
    name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
      ]

  # Step 4: Deploy Cloud Run service
  - id: "deploy-cloud-run"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "cloud-run-learning",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/cloud-run-learning:$BUILD_ID",
        "--region",
        "us-central1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
      ]

  # Step 5: Build Next.js client
  - id: "build-nextjs"
    name: "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/nextjs:v1"
    args: ["cd client && yarn build"]

  # Step 6: Build Cloud Run Functions
  - id: "build-cloud-run-functions"
    name: "node:22-alpine"
    entrypoint: "yarn"
    args: ["--cwd", "cloud-run-functions", "build"]

  # Step 7: Deploy Functions + Hosting together (optimized single deployment)
  - id: "deploy-firebase"
    name: "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/firebase:v1"
    args:
      [
        "deploy",
        "--only",
        "functions,hosting",
        "--non-interactive",
        "--project",
        "$PROJECT_ID",
      ]

# Logging configuration (required when using custom service account)
options:
  logging: CLOUD_LOGGING_ONLY
